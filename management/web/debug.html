<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>文件管理API测试</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; }
        button { margin: 5px; padding: 10px; }
        .result { margin-top: 10px; padding: 10px; background: #f5f5f5; }
    </style>
</head>
<body>
    <h1>文件管理API测试</h1>
    
    <div class="test-section">
        <h3>1. 测试获取文件列表</h3>
        <button onclick="testGetFiles()">获取文件列表</button>
        <div id="files-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>2. 测试创建文件夹</h3>
        <input type="text" id="folder-name" placeholder="文件夹名称" value="测试文件夹">
        <button onclick="testCreateFolder()">创建文件夹</button>
        <div id="folder-result" class="result"></div>
    </div>
    
    <div class="test-section">
        <h3>3. 测试获取文件夹树</h3>
        <button onclick="testGetFolderTree()">获取文件夹树</button>
        <div id="tree-result" class="result"></div>
    </div>

    <script>
        const API_BASE = '/api/v1/files';
        
        async function testGetFiles() {
            try {
                const response = await fetch(`${API_BASE}?currentPage=1&size=10`);
                const data = await response.json();
                document.getElementById('files-result').innerHTML = 
                    `<strong>状态:</strong> ${response.status}<br>
                     <strong>响应:</strong> <pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('files-result').innerHTML = 
                    `<strong>错误:</strong> ${error.message}`;
            }
        }
        
        async function testCreateFolder() {
            const folderName = document.getElementById('folder-name').value;
            if (!folderName) {
                alert('请输入文件夹名称');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE}/create_folder`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        folder_name: folderName
                    })
                });
                const data = await response.json();
                document.getElementById('folder-result').innerHTML = 
                    `<strong>状态:</strong> ${response.status}<br>
                     <strong>响应:</strong> <pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('folder-result').innerHTML = 
                    `<strong>错误:</strong> ${error.message}`;
            }
        }
        
        async function testGetFolderTree() {
            try {
                const response = await fetch(`${API_BASE}/folder_tree`);
                const data = await response.json();
                document.getElementById('tree-result').innerHTML = 
                    `<strong>状态:</strong> ${response.status}<br>
                     <strong>响应:</strong> <pre>${JSON.stringify(data, null, 2)}</pre>`;
            } catch (error) {
                document.getElementById('tree-result').innerHTML = 
                    `<strong>错误:</strong> ${error.message}`;
            }
        }
    </script>
</body>
</html>
